<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overwatch Counterpick Generator</title>
    <!-- configure Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        owOrange: '#F99E1A',
                        owDark: '#0F141C',
                        owCard: '#1A2230',
                        tankBlue: '#00A8FF',
                        dpsRed: '#E84118',
                        supportGreen: '#4CD137'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-owDark text-slate-100 min-h-screen font-sans flex flex-col items-center justify-start p-4 sm:p-8">

    <div class="w-full max-w-4xl space-y-6">

        <!-- title/header -->
        <header class="text-center space-y-2 border-b border-slate-700 pb-4">
            <h1 class="text-3xl sm:text-4xl font-extrabold tracking-wider uppercase text-white flex items-center justify-center gap-3">
                <span class="text-owOrange">Overwatch</span> Counterpick API
            </h1>
            <p class="text-slate-400 text-sm">Input a 5-hero composition, get the most ideal countercomposition.</p>
        </header>

        <!-- input card -->
        <div class="bg-owCard border border-slate-700/60 rounded-xl p-6 shadow-2xl space-y-6">
            <h2 class="text-xl font-bold tracking-wide uppercase text-owOrange flex items-center gap-2">
                <span class="w-3 h-3 rounded-full bg-owOrange"></span> Enemy Team Composition
            </h2>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">

                <!-- Tank -->
                <div class="relative overflow-hidden space-y-2 bg-slate-900/50 p-4 rounded-lg border-l-4 border-tankBlue">
                    <!-- Background Watermark Icon -->
                    <img src="/static/images/tank_icon.png" alt="" class="absolute -left-2 -bottom-0 w-24 h-24 opacity-10 pointer-events-none object-contain" />
                    
                    <label class="relative z-10 block text-sm font-bold uppercase tracking-wider text-tankBlue">Tank</label>
                    <select id="tank1" class="relative z-10 w-full bg-slate-800 border border-slate-700 text-white rounded-lg p-2.5 focus:ring-2 focus:ring-tankBlue focus:outline-none transition"></select>
                </div>

                <!-- DPS -->
                <div class="relative overflow-hidden space-y-3 bg-slate-900/50 p-4 rounded-lg border-l-4 border-dpsRed">
                    <img src="/static/images/damage_icon.png" alt="" class="absolute -left-2 -bottom-0 w-24 h-24 opacity-10 pointer-events-none object-contain" />
                    
                    <label class="relative z-10 block text-sm font-bold uppercase tracking-wider text-dpsRed">Damage (DPS)</label>
                    <div class="relative z-10">
                        <span class="text-xs text-slate-400">DPS 1</span>
                        <select id="dps1" class="w-full bg-slate-800 border border-slate-700 text-white rounded-lg p-2.5 focus:ring-2 focus:ring-dpsRed focus:outline-none transition"></select>
                    </div>
                    <div class="relative z-10">
                        <span class="text-xs text-slate-400">DPS 2</span>
                        <select id="dps2" class="w-full bg-slate-800 border border-slate-700 text-white rounded-lg p-2.5 focus:ring-2 focus:ring-dpsRed focus:outline-none transition"></select>
                    </div>
                </div>

                <!-- Support -->
                <div class="relative overflow-hidden space-y-3 bg-slate-900/50 p-4 rounded-lg border-l-4 border-supportGreen">
                    <img src="/static/images/support_icon.png" alt="" class="absolute -left-2 -bottom-0 w-24 h-24 opacity-10 pointer-events-none object-contain" />
                    
                    <label class="relative z-10 block text-sm font-bold uppercase tracking-wider text-supportGreen">Support</label>
                    <div class="relative z-10">
                        <span class="text-xs text-slate-400">Support 1</span>
                        <select id="sup1" class="w-full bg-slate-800 border border-slate-700 text-white rounded-lg p-2.5 focus:ring-2 focus:ring-supportGreen focus:outline-none transition"></select>
                    </div>
                    <div class="relative z-10">
                        <span class="text-xs text-slate-400">Support 2</span>
                        <select id="sup2" class="w-full bg-slate-800 border border-slate-700 text-white rounded-lg p-2.5 focus:ring-2 focus:ring-supportGreen focus:outline-none transition"></select>
                    </div>
                </div>

            </div>

            <!-- calculate counter composition button -->
            <button onclick="calculate()" class="w-full bg-owOrange hover:bg-amber-600 text-slate-950 font-black uppercase tracking-wider py-3 px-6 rounded-lg shadow-lg hover:shadow-owOrange/20 transition duration-200 transform active:scale-[0.99]">
                Calculate Counter Composition
            </button>
        </div>

        <!-- output -->
        <div class="bg-owCard border border-slate-700/60 rounded-xl p-6 shadow-2xl space-y-4">
            <h3 class="text-xl font-bold tracking-wide uppercase text-white flex items-center justify-between">
                <span>Recommended Counter Team</span>
                <span id="analyzed-badge" class="hidden text-xs bg-slate-800 border border-slate-700 text-slate-400 px-3 py-1 rounded-full font-normal italic"></span>
            </h3>

            <div id="placeholder" class="text-center py-12 border-2 border-dashed border-slate-700 rounded-lg text-slate-500">
                Ideal counter composition is shown here.
            </div>

            <!-- output cards -->
            <div id="results-grid" class="hidden grid grid-cols-1 md:grid-cols-3 gap-4">
                
                <!-- Tank Column -->
                <div class="relative overflow-hidden bg-slate-900/30 p-3 rounded-lg space-y-3">
                    <img src="/static/images/tank_icon.png" alt="" class="absolute -right-2 -bottom-2 w-20 h-20 opacity-10 pointer-events-none object-contain" />
                    <div class="relative z-10 text-xs font-black uppercase text-tankBlue tracking-widest border-b border-tankBlue/30 pb-1">Tank</div>
                    <div id="tank-cards" class="relative z-10 space-y-2"></div>
                </div>

                <!-- DPS Column -->
                <div class="relative overflow-hidden bg-slate-900/30 p-3 rounded-lg space-y-3">
                    <img src="/static/images/damage_icon.png" alt="" class="absolute -right-2 -bottom-2 w-20 h-20 opacity-10 pointer-events-none object-contain" />
                    <div class="relative z-10 text-xs font-black uppercase text-dpsRed tracking-widest border-b border-dpsRed/30 pb-1">Damage</div>
                    <div id="dps-cards" class="relative z-10 space-y-2"></div>
                </div>

                <!-- Support Column -->
                <div class="relative overflow-hidden bg-slate-900/30 p-3 rounded-lg space-y-3">
                    <img src="/static/images/support_icon.png" alt="" class="absolute -right-2 -bottom-2 w-20 h-20 opacity-10 pointer-events-none object-contain" />
                    <div class="relative z-10 text-xs font-black uppercase text-supportGreen tracking-widest border-b border-supportGreen/30 pb-1">Support</div>
                    <div id="support-cards" class="relative z-10 space-y-2"></div>
                </div>

            </div>
        </div>

    </div>

    <script>
        const tanks = ["D.Mon", "D.Va", "Domina", "Doomfist", "Hazard", "Junker Queen", "Mauga", "Orisa", "Ramattra", "Reinhardt", "Roadhog", "Sigma", "Winston", "Wrecking Ball", "Zarya"];
        const dps = ["Anran", "Ashe", "Bastion", "Cassidy", "Echo", "Emre", "Freja", "Genji", "Hanzo", "Junkrat", "Mei", "Pharah", "Reaper", "Shion", "Sierra", "Sojourn", "Soldier: 76", "Sombra", "Symmetra", "Torbjörn", "Tracer", "Vendetta", "Venture", "Widowmaker"];
        const supports = ["Ana", "Baptiste", "Brigitte", "Illari", "Jetpack Cat", "Juno", "Kiriko", "Lifeweaver", "Lúcio", "Mercy", "Mizuki", "Moira", "Wuyang", "Zenyatta"];

        function populateDropdown(elementId, heroList) {
            const select = document.getElementById(elementId);
            heroList.sort().forEach(hero => {
                const option = document.createElement("option");
                option.value = hero;
                option.textContent = hero;
                select.appendChild(option);
            });
        }

        window.onload = () => {
            populateDropdown("tank1", tanks);
            populateDropdown("dps1", dps);
            populateDropdown("dps2", dps);
            populateDropdown("sup1", supports);
            populateDropdown("sup2", supports);
            
            document.getElementById('dps2').selectedIndex = 1;
            document.getElementById('sup2').selectedIndex = 1;
        };

        function createHeroCard(heroName, score, borderClass, bgBadgeClass) {
            return `
                <div class="bg-slate-900 border-l-4 ${borderClass} border-slate-700/80 rounded-r-lg p-3.5 flex items-center justify-between shadow-md hover:bg-slate-800/80 transition">
                    <div>
                        <div class="font-black text-lg text-white leading-tight">${heroName}</div>
                        <div class="text-[10px] uppercase tracking-wider text-slate-400 font-bold">Optimal Pick</div>
                    </div>
                    <div class="${bgBadgeClass} text-slate-950 font-extrabold text-sm px-2.5 py-1 rounded-md shadow-inner">
                        ${score}
                    </div>
                </div>
            `;
        }

        async function calculate() {
            const tankArr = [document.getElementById('tank1').value];
            const dpsArr = [document.getElementById('dps1').value, document.getElementById('dps2').value];
            const supportsArr = [document.getElementById('sup1').value, document.getElementById('sup2').value];

            const response = await fetch('/api/v1/calculate-composition/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ tanks: tankArr, dps: dpsArr, supports: supportsArr })
            });

            const data = await response.json();
            const comp = data.recommended_composition;

            document.getElementById('placeholder').classList.add('hidden');
            document.getElementById('results-grid').classList.remove('hidden');

            const tankContainer = document.getElementById('tank-cards');
            tankContainer.innerHTML = comp.Tank.map(item => 
                createHeroCard(item.hero, item.score, 'border-tankBlue', 'bg-tankBlue')
            ).join('');

            const dpsContainer = document.getElementById('dps-cards');
            dpsContainer.innerHTML = comp.DPS.map(item => 
                createHeroCard(item.hero, item.score, 'border-dpsRed', 'bg-dpsRed')
            ).join('');

            const supportContainer = document.getElementById('support-cards');
            supportContainer.innerHTML = comp.Support.map(item => 
                createHeroCard(item.hero, item.score, 'border-supportGreen', 'bg-supportGreen')
            ).join('');

            const badge = document.getElementById('analyzed-badge');
            badge.textContent = `Analyzed vs: ${data.enemy_analyzed.join(', ')}`;
            badge.classList.remove('hidden');
        }
    </script>
</body>
</html>
